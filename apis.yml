- name: Synthefy Forecasting API
  description: >-
    Direct REST access to Synthefy's foundation models for multivariate time-series
    forecasting (Migas-1.0), with automatic timestamp/value/metadata handling and
    exogenous covariate context. Called via the synthefy Python client.
