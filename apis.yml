description: >-
  Synthefy builds foundation models for structured data, replacing task-specific
  machine learning (XGBoost, LightGBM, ARIMA, Prophet) with a single API call.
  Its Nori tabular model performs in-context regression and classification on any
  table with no training, and its time-series Forecasting API (Migas-1.0) delivers
  multivariate probabilistic forecasts with exogenous context. The platform is
  delivered as a hosted REST API, Python SDKs, Docker containers, AWS SageMaker,
  and Snowflake, serving banking, retail, insurance, healthcare, infrastructure,
  and marketing use cases with SOC 2 Type II, HIPAA, GDPR, and zero-data-retention
  compliance.
